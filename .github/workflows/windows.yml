name: Build VocalForge Windows

on:
  push:
    branches: ["main"]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: |
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" installer\VocalForge.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VocalForge-Windows-Installer
          path: installer\Output\VocalForge-Windows-Installer.exe
          if-no-files-found: error

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: VocalForge-VST3
          path: build\VocalForge_artefacts\Release\VST3\VocalForge.vst3
          if-no-files-found: error
