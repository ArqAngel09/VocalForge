name: Build VocalForge Windows

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "vocalforge-2.0"]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 18 2026" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: powershell
        run: |
          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler (ISCC.exe) was not found." }
          & $iscc installer\VocalForge.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VocalForge-Windows-Installer
          path: installer\Output\VocalForge-Windows-Installer.exe
          if-no-files-found: error

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: VocalForge-VST3
          path: build\VocalForge_artefacts\Release\VST3\VocalForge.vst3
          if-no-files-found: error
